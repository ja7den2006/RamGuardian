name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RamGuardian.slnx

      - name: Build
        run: dotnet build RamGuardian.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RamGuardian.slnx --configuration Release --no-build
