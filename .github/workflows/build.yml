name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RamGuardian.slnx

      - name: Build
        run: dotnet build RamGuardian.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RamGuardian.slnx --configuration Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Package Release
        shell: pwsh
        run: .\scripts\Publish-Release.ps1 -Version "${{ github.ref_name }}"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RamGuardian-${{ github.ref_name }}-win-x64
          path: artifacts/RamGuardian-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/RamGuardian-${{ github.ref_name }}-win-x64.zip
